name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  node:
    name: TypeScript — build, typecheck, unit e golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contratos API↔IA exportados estão atualizados
        run: |
          pnpm contracts:export
          git diff --exit-code packages/contracts/schemas || (echo "::error::Rode 'pnpm contracts:export' e versione packages/contracts/schemas" && exit 1)

  integration:
    name: Integração (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Testes de integração (sobe docker-compose.test.yml)
        run: pnpm test:integration
      - name: Migrations correspondem ao schema Prisma
        run: |
          docker compose -f docker-compose.test.yml up -d --wait postgres
          cd packages/database
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://coxia:coxia@localhost:55432/postgres" --exit-code

  ai:
    name: FastAPI — lint e pytest
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/ai }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  visual:
    name: Frontend — golden visual (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env: { CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@10.12.1
      - run: pnpm install --frozen-lockfile --filter @coxia/web
      - run: pnpm --filter @coxia/web test
      - run: pnpm --filter @coxia/web exec playwright test
        env: { HOME: /root }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  compose-smoke:
    name: Smoke — Docker Compose completo
    runs-on: ubuntu-latest
    needs: [node, ai]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe todos os serviços e espera os healthchecks
        run: docker compose up -d --build --wait --wait-timeout 420 api worker ai web
      - name: Healthchecks
        run: |
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/health/ready
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:5173/
          docker compose exec -T worker node -e "fetch('http://localhost:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})"
      - name: Contrato API↔IA na rede do compose
        run: |
          curl -fsS -X POST http://localhost:8000/v1/projects/events \
            -H 'authorization: Bearer dev-ai-service-token' -H 'content-type: application/json' \
            -d '{"organizationId":"o","projectId":"p","projectTitle":null,"timezone":"America/Sao_Paulo","now":"2026-11-06T10:00:00-03:00","projectStateSummary":null,"messages":[{"id":"golden-xpo-01","authorPhone":null,"authorName":null,"sentAt":"2026-11-06T09:40:00-03:00","text":"x","attachmentKind":null}]}' \
            | grep -q '"type":"task"'
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
